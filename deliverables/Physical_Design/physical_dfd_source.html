<script>
// QuickPhone physical DFDs — converted from the logical v3.1 set (Sprint 2) using the textbook's
// logical-to-physical steps: implementation references on every process, a human-machine boundary,
// system-related processes and stores, physical data elements on flows, and stores named by their tables.
const NS='http://www.w3.org/2000/svg';
const C={ent:'#dce8f5',entB:'#1f4e79',proc:'#fff7de',procB:'#b8860b',man:'#f0f0f0',manB:'#666',
  store:'#e8f1e0',storeB:'#4d7a2e',line:'#333',hmb:'#c0392b'};
const TY=90;
let svg, root, PENDING=null, SEGS=[];
// Does segment a-b touch rectangle r (grown by pad)?
function segHitsRect(a,b,r,pad){const x0=r.x-pad,y0=r.y-pad,x1=r.x+r.width+pad,y1=r.y+r.height+pad;
  let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
  for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
    if(p===0){if(q<0)return false;continue;}const r2=q/p;
    if(p<0){if(r2>t1)return false;if(r2>t0)t0=r2;}else{if(r2<t0)return false;if(r2<t1)t1=r2;}}
  return true;}
// Store-flow labels are placed after everything else: each slides along its own line (and a little
// to either side of it) to the spot that touches the fewest nodes, labels and other flows' lines.
function placeLabels(N,scope,group){
  const pad=5,boxes=[];
  const hit=(a,b)=>a.x<b.x+b.width+pad&&b.x<a.x+a.width+pad&&a.y<b.y+b.height+pad&&b.y<a.y+a.height+pad;
  Object.values(N).forEach(n=>{const b=bounds(n);boxes.push({x:b.l,y:b.t,width:b.r-b.l,height:b.b-b.t});});
  [...scope.querySelectorAll(':scope > text')].forEach(t=>boxes.push(t.getBBox()));
  const ts=[0.5,0.42,0.58,0.34,0.66,0.26,0.74,0.18,0.82,0.12,0.88];
  PENDING.sort((a,b)=>Math.hypot(a.p2[0]-a.p1[0],a.p2[1]-a.p1[1])-Math.hypot(b.p2[0]-b.p1[0],b.p2[1]-b.p1[1]));
  PENDING.forEach(({f,p1,p2})=>{let best=null,bestS=1e9;
    const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1,nx=-(p2[1]-p1[1])/L,ny=(p2[0]-p1[0])/L;
    search: for(const off of [0,16,-16,30,-30])for(const t of ts){
      const x=p1[0]+(p2[0]-p1[0])*t+nx*off,y=p1[1]+(p2[1]-p1[1])*t+ny*off;
      const el=txt(x,y,f.label,{fs:f.fs||19,halo:1},group),bb=el.getBBox();
      const s=10*boxes.filter(b=>hit(bb,b)).length+SEGS.filter(g=>g.f!==f&&segHitsRect(g.a,g.b,bb,2)).length+(off?0.5:0);
      if(s<bestS){if(best)best.el.remove();best={el,bb};bestS=s;}else el.remove();
      if(s===0)break search;}
    boxes.push(best.bb);});
}
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e;}
function txt(x,y,s,o={},p){
  const lines=String(s).split('\n'), fs=o.fs||20, lh=fs*1.2;
  const a={'font-size':fs,'font-weight':o.fw||400,'text-anchor':o.anchor||'middle',fill:o.fill||'#222'};
  if(o.ff)a['font-family']=o.ff;
  if(o.it)a['font-style']='italic';
  if(o.halo){a.stroke='#fff';a['stroke-width']=7;a['stroke-linejoin']='round';a['paint-order']='stroke';}
  const t=mk('text',a,p);
  const y0=y-(lines.length-1)*lh/2+fs*0.35;
  lines.forEach((l,i)=>{const ts=mk('tspan',{x,y:y0+i*lh},t);ts.textContent=l;});
  return t;
}
const MONO="Consolas,'Courier New',monospace";
// ---------- node builders ----------
const E=(id,x,y,label,o={})=>({id,type:'entity',x,y,w:o.w||300,h:o.h||150,label,dup:o.dup});
const P=(id,x,y,num,label,o={})=>({id,type:'process',x,y,w:o.w||380,h:o.h||230,num,label,fs:o.fs,impl:o.impl,manual:o.manual});
const S=(id,x,y,num,label,o={})=>{const n=o.tables?o.tables.split('\n').length:0;
  return {id,type:'store',x,y,w:o.w||440,h:o.h||(n?52+20*n:64),num,label,dup:o.dup,tables:o.tables};};
const K=(id,x,y,label)=>({id,type:'clock',x,y,w:76,h:76,label});
const F=(from,to,label,o={})=>Object.assign({from,to,label},o);

function bounds(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity')return{l:n.x-hw-8,r:n.x+hw,t:n.y-hh-8,b:n.y+hh};
  return{l:n.x-hw,r:n.x+hw,t:n.y-hh,b:n.y+hh};}
function exitPt(n,P,Q){const b=bounds(n),dx=Q[0]-P[0],dy=Q[1]-P[1];let s=Infinity;
  if(dx>0)s=Math.min(s,(b.r-P[0])/dx);if(dx<0)s=Math.min(s,(b.l-P[0])/dx);
  if(dy>0)s=Math.min(s,(b.b-P[1])/dy);if(dy<0)s=Math.min(s,(b.t-P[1])/dy);
  return[P[0]+s*dx,P[1]+s*dy];}

function drawNode(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity'){
    mk('rect',{x:n.x-hw-8,y:n.y-hh-8,width:n.w,height:n.h,fill:C.entB});
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.ent,stroke:C.entB,'stroke-width':2.5});
    if(n.dup)mk('line',{x1:n.x+hw-28,y1:n.y+hh,x2:n.x+hw,y2:n.y+hh-28,stroke:C.entB,'stroke-width':2.5});
    txt(n.x,n.y,n.label,{fs:27,fw:700,fill:'#1a1a1a'});
  }else if(n.type==='process'){
    const fill=n.manual?C.man:C.proc, st=n.manual?C.manB:C.procB;
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,rx:18,fill,stroke:st,'stroke-width':2.5});
    mk('line',{x1:n.x-hw,y1:n.y-hh+46,x2:n.x+hw,y2:n.y-hh+46,stroke:st,'stroke-width':2});
    txt(n.x,n.y-hh+23,n.num,{fs:23,fw:700});
    let ib=0;
    if(n.impl){const nl=n.impl.split('\n').length;ib=16+nl*20;
      mk('line',{x1:n.x-hw,y1:n.y+hh-ib,x2:n.x+hw,y2:n.y+hh-ib,stroke:st,'stroke-width':1.5});
      txt(n.x,n.y+hh-ib/2,n.impl,{fs:17,it:1,fill:n.manual?'#444':'#6b5410'});}
    txt(n.x,(n.y-hh+46+n.y+hh-ib)/2,n.label,{fs:n.fs||25,fw:700,fill:'#1a1a1a'});
  }else if(n.type==='clock'){
    mk('circle',{cx:n.x,cy:n.y,r:34,fill:'#fff',stroke:'#555','stroke-width':2.5});
    mk('line',{x1:n.x,y1:n.y,x2:n.x,y2:n.y-22,stroke:'#555','stroke-width':3});
    mk('line',{x1:n.x,y1:n.y,x2:n.x+16,y2:n.y+6,stroke:'#555','stroke-width':3});
    txt(n.x,n.y+62,n.label,{fs:19,fw:700,fill:'#444'});
  }else{
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.store});
    const st={stroke:C.storeB,'stroke-width':2.5};
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x+hw,y2:n.y-hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y+hh,x2:n.x+hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x-hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw+72,y1:n.y-hh,x2:n.x-hw+72,y2:n.y+hh},st));
    if(n.dup)mk('line',Object.assign({x1:n.x-hw+12,y1:n.y-hh,x2:n.x-hw+12,y2:n.y+hh},st));
    txt(n.x-hw+(n.dup?42:36),n.y,n.num,{fs:n.num.length>3?16:23,fw:700});
    if(n.tables){
      txt(n.x-hw+90,n.y-hh+24,n.label,{fs:21,fw:700,anchor:'start',fill:'#1a1a1a'});
      txt(n.x-hw+90,n.y-hh+46+(n.tables.split('\n').length-1)*10+4,n.tables,{fs:16,anchor:'start',fill:'#2e5a1c',ff:MONO});
    }else txt(n.x-hw+90,n.y,n.label,{fs:23,fw:700,anchor:'start',fill:'#1a1a1a'});
  }}

// Point where an orthogonal route meets a node: stores attach at a side; other nodes at the
// top/bottom edge when the route arrives vertically, else at a side.
function entry(n,p){const b=bounds(n);
  if(n.type==='store')return[p[0]<n.x?n.x-n.w/2:n.x+n.w/2,p[1]];
  if(p[0]>=b.l&&p[0]<=b.r)return[p[0],p[1]<n.y?b.t:b.b];
  return[p[0]<n.x?b.l:b.r,p[1]];}
function drawRoute(f,N){const A=N[f.from],B=N[f.to],w=f.pts;
  const pts=[entry(A,w[0]),...w,entry(B,w[w.length-1])];
  mk('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  for(let i=1;i<pts.length;i++)SEGS.push({a:pts[i-1],b:pts[i],f});
  if(f.label)txt(f.lp[0],f.lp[1],f.label,{fs:f.fs||19,halo:1,anchor:f.la||'middle'});}
// Several stores feeding one process through a shared bus (converging data flow).
function drawBus(b,N){const T=N[b.to];
  const ys=b.ids.map(id=>N[id].y);
  b.ids.forEach(id=>{const s=N[id];const ex=b.x<s.x?s.x-s.w/2:s.x+s.w/2;
    mk('line',{x1:ex,y1:s.y,x2:b.x,y2:s.y,stroke:C.line,'stroke-width':2.2});
    mk('circle',{cx:b.x,cy:s.y,r:4,fill:C.line});});
  mk('line',{x1:b.x,y1:Math.min(...ys,b.y),x2:b.x,y2:Math.max(...ys,b.y),stroke:C.line,'stroke-width':2.2});
  SEGS.push({a:[b.x,Math.min(...ys,b.y)],b:[b.x,Math.max(...ys,b.y)],f:b});
  b.ids.forEach(id=>{const s=N[id];SEGS.push({a:[b.x<s.x?s.x-s.w/2:s.x+s.w/2,s.y],b:[b.x,s.y],f:b});});
  const tx=b.x<T.x?T.x-T.w/2:T.x+T.w/2;
  mk('line',{x1:b.x,y1:b.y,x2:tx,y2:b.y,stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  txt(b.lp[0],b.lp[1],b.label,{fs:19,halo:1,anchor:b.la||'middle'});}

function drawFlow(f,N){if(f.pts)return drawRoute(f,N);const A=N[f.from],B=N[f.to];let PA,PB;
  if(f.y!=null){PA=[A.x,f.y];PB=[B.x,f.y];}
  else if(f.x!=null){PA=[f.x,A.y];PB=[f.x,B.y];}
  else{const ao=f.ao||[0,0],bo=f.bo||ao;PA=[A.x+ao[0],A.y+ao[1]];PB=[B.x+bo[0],B.y+bo[1]];}
  const storeLink=(A.type==='store'||B.type==='store')&&f.x==null&&f.y==null;
  const anc=(n,o,off)=>{if(!storeLink)return null;const lim=n.type==='store'?n.h/2-10:n.h/2-14;
    return[o.x<n.x?n.x-n.w/2:n.x+n.w/2,n.y+Math.max(-lim,Math.min(lim,off?off[1]:0))];};
  const sa=anc(A,B,f.ao),sb=anc(B,A,f.bo||f.ao);
  const p1=sa||exitPt(A,PA,sb||PB),p2=sb||exitPt(B,PB,sa||PA);
  const a={x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'};
  if(f.ctl)a['stroke-dasharray']='12 8';
  mk('line',a);SEGS.push({a:p1,b:p2,f});
  if(!f.label)return;
  if(PENDING&&f.x==null&&f.y==null){PENDING.push({f,p1,p2});return;}
  const t=f.t??0.5,mx=p1[0]+(p2[0]-p1[0])*t,my=p1[1]+(p2[1]-p1[1])*t;
  const fs=f.fs||19,nl=f.label.split('\n').length,lh=fs*1.2;
  let lx=mx,ly=my;
  const horiz=Math.abs(p2[1]-p1[1])<2, vert=Math.abs(p2[0]-p1[0])<2;
  const o={fs,halo:1,it:f.ctl};
  if(f.lpos==='below')ly=my+nl*lh/2+6;
  else if(f.lpos==='right'||(vert&&!f.lpos)){lx=mx+14;return txt(lx+(f.lx||0),my+(f.ly||0),f.label,Object.assign(o,{anchor:'start'}));}
  else if(horiz||f.lpos==='above')ly=my-nl*lh/2-6;
  txt(lx+(f.lx||0),ly+(f.ly||0),f.label,o);
}

function boundary(b){
  mk('rect',{x:b[0],y:b[1],width:b[2],height:b[3],rx:34,fill:'none',stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'18 10'});
  txt(b[0]+30,b[1]+28,b[4]||'Human–machine boundary: QuickPhone web app and its database',{fs:20,fw:700,anchor:'start',fill:C.hmb,halo:1});
}

  txt(x+98,y+80,'External entity',{fs:17,anchor:'start'});
  mk('rect',{x:x+26,y:y+110,width:56,height:48,rx:8,fill:C.proc,stroke:C.procB,'stroke-width':2});
  mk('line',{x1:x+26,y1:y+122,x2:x+82,y2:y+122,stroke:C.procB,'stroke-width':1.5});mk('line',{x1:x+26,y1:y+146,x2:x+82,y2:y+146,stroke:C.procB,'stroke-width':1.5});
  txt(x+98,y+125,'Automated process',{fs:17,anchor:'start'});txt(x+98,y+147,'(bottom band = how / who)',{fs:15,anchor:'start',fill:'#555',it:1});
  mk('rect',{x:x+26,y:y+176,width:56,height:44,rx:8,fill:C.man,stroke:C.manB,'stroke-width':2});
  mk('line',{x1:x+26,y1:y+188,x2:x+82,y2:y+188,stroke:C.manB,'stroke-width':1.5});
  txt(x+98,y+198,'Manual process',{fs:17,anchor:'start'});
  mk('line',{x1:x+20,y1:y+256,x2:x+86,y2:y+256,stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'12 7'});
  txt(x+98,y+256,'Human–machine boundary',{fs:17,anchor:'start'});
  mk('rect',{x:c2,y:y+56,width:90,height:44,fill:C.store});['M0,0H90','M0,44H90','M0,0V44','M20,0V44'].forEach(d=>mk('path',{d,transform:`translate(${c2},${y+56})`,stroke:C.storeB,'stroke-width':2,fill:'none'}));
  txt(c2+104,y+70,'Data store',{fs:17,anchor:'start'});txt(c2+104,y+92,'table names',{fs:15,anchor:'start',fill:'#2e5a1c',ff:MONO});
  mk('line',{x1:c2,y1:y+135,x2:c2+86,y2:y+135,stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  txt(c2+104,y+135,'Data flow (one way)',{fs:17,anchor:'start'});
  mk('line',{x1:c2,y1:y+190,x2:c2+86,y2:y+190,stroke:C.line,'stroke-width':2.2,'stroke-dasharray':'10 6','marker-end':'url(#arr)'});
  txt(c2+104,y+190,'Timer trigger (control)',{fs:17,anchor:'start'});
  [y+232,y+256].forEach(yy=>{mk('line',{x1:c2,y1:yy,x2:c2+40,y2:yy,stroke:C.line,'stroke-width':2.2});mk('circle',{cx:c2+40,cy:yy,r:4,fill:C.line});});
  mk('line',{x1:c2+40,y1:y+232,x2:c2+40,y2:y+268,stroke:C.line,'stroke-width':2.2});
  mk('line',{x1:c2+40,y1:y+268,x2:c2+86,y2:y+268,stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  txt(c2+104,y+242,'Converging flow',{fs:16,anchor:'start'});txt(c2+104,y+264,'(every symbol drawn once)',{fs:15,anchor:'start',fill:'#555',it:1});
}
