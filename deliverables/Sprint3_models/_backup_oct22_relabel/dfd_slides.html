<script>
// QuickPhone DFDs, slide edition (Sprint 3 rev. 2). One spec, two views: ?v=log|phys, ?d=<diagram>.
// Built for 16:9 slides (1920x1080): labels >= 19px, process names 25px. Every entity and data store is drawn
// once per diagram. The 7 data stores match the ERD exactly: each store lists the entities it holds.
// Level 0 is shown whole (d=level0, a large poster for documents/PDF) and in three readable parts (l0a, l0b, l0c).
const NS='http://www.w3.org/2000/svg', MONO="Consolas,'Courier New',monospace";
const Q=new URLSearchParams(location.search), PHYS=Q.get('v')!=='log';
const C={ent:'#dce8f5',entB:'#1f4e79',proc:'#fff7de',procB:'#b8860b',man:'#f0f0f0',manB:'#666',
  store:'#e8f1e0',storeB:'#4d7a2e',line:'#333',hmb:'#c0392b'};
const TY=100;
let svg, root, PENDING=null, SEGS=[];
const pick=x=>Array.isArray(x)?(PHYS?x[1]:x[0]):x;
const keep=o=>!(o.phys&&!PHYS)&&!(o.log&&PHYS);
function segHitsRect(a,b,r,pad){const x0=r.x-pad,y0=r.y-pad,x1=r.x+r.width+pad,y1=r.y+r.height+pad;
  let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
  for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
    if(p===0){if(q<0)return false;continue;}const r2=q/p;
    if(p<0){if(r2>t1)return false;if(r2>t0)t0=r2;}else{if(r2<t0)return false;if(r2<t1)t1=r2;}}
  return true;}
// Store-flow labels are placed last: each slides along its own line (and to either side) to the spot touching
// the fewest nodes, labels and other flows' lines.
function placeLabels(N,scope,group){
  const pad=4,boxes=[];
  const hit=(a,b)=>a.x<b.x+b.width+pad&&b.x<a.x+a.width+pad&&a.y<b.y+b.height+pad&&b.y<a.y+a.height+pad;
  Object.values(N).forEach(n=>{const b=bounds(n);boxes.push({x:b.l,y:b.t,width:b.r-b.l,height:b.b-b.t});});
  [...scope.querySelectorAll(':scope > text')].forEach(t=>boxes.push(t.getBBox()));
  const ts=[0.5,0.42,0.58,0.34,0.66,0.26,0.74,0.18,0.82,0.12,0.88];
  PENDING.sort((a,b)=>Math.hypot(a.p2[0]-a.p1[0],a.p2[1]-a.p1[1])-Math.hypot(b.p2[0]-b.p1[0],b.p2[1]-b.p1[1]));
  PENDING.forEach(({f,p1,p2})=>{let best=null,bestS=1e9;
    const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1,nx=-(p2[1]-p1[1])/L,ny=(p2[0]-p1[0])/L;
    search: for(const off of [0,16,-16,30,-30])for(const t of ts){
      const x=p1[0]+(p2[0]-p1[0])*t+nx*off,y=p1[1]+(p2[1]-p1[1])*t+ny*off;
      const el=txt(x,y,f.label,{fs:f.fs||FS,halo:1},group),bb=el.getBBox();
      const s=10*boxes.filter(b=>hit(bb,b)).length+SEGS.filter(g=>g.f!==f&&segHitsRect(g.a,g.b,bb,2)).length+(off?0.5:0);
      if(s<bestS){if(best)best.el.remove();best={el,bb};bestS=s;}else el.remove();
      if(s===0)break search;}
    boxes.push(best.bb);});
}
let FS=19;
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e;}
function txt(x,y,s,o={},p){
  const lines=String(s).split('\n'), fs=o.fs||20, lh=fs*1.18;
  const a={'font-size':fs,'font-weight':o.fw||400,'text-anchor':o.anchor||'middle',fill:o.fill||'#222'};
  if(o.ff)a['font-family']=o.ff;
  if(o.it)a['font-style']='italic';
  if(o.halo){a.stroke='#fff';a['stroke-width']=7;a['stroke-linejoin']='round';a['paint-order']='stroke';}
  const t=mk('text',a,p);
  const y0=y-(lines.length-1)*lh/2+fs*0.35;
  lines.forEach((l,i)=>{const ts=mk('tspan',{x,y:y0+i*lh},t);ts.textContent=l;});
  return t;
}
// ---------- node builders ----------
const E=(id,x,y,label,o={})=>({id,type:'entity',x,y,w:o.w||250,h:o.h||130,label});
const P=(id,x,y,num,label,o={})=>({id,type:'process',x,y,w:o.w||320,h:o.h||(PHYS?172:160),num,label,fs:o.fs,impl:o.impl,manual:o.manual,phys:o.phys,log:o.log});
const STORE={
 d1:['D1','Customers & Devices','customer, device'],
 d2:['D2','Appointments','appointment'],
 d3:['D3','Repair Jobs','repair_job, job_status_history,\nquote, payment, job_part'],
 d4:['D4','Parts Inventory','part, store_part_stock,\ninventory_txn'],
 d5:['D5','Purchase Orders','purchase_order, po_line'],
 d6:['D6','Suppliers','supplier'],
 d7:['D7','Staff & Stores','store, employee']};
const S=(id,x,y,h,o={})=>{const [num,label,tables]=STORE[id];return {id,type:'store',x,y,w:o.w||440,h,num,label,tables};};
const F=(from,to,label,o={})=>Object.assign({from,to,label},o);

function bounds(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity')return{l:n.x-hw-8,r:n.x+hw,t:n.y-hh-8,b:n.y+hh};
  return{l:n.x-hw,r:n.x+hw,t:n.y-hh,b:n.y+hh};}
function exitPt(n,P,Q){const b=bounds(n),dx=Q[0]-P[0],dy=Q[1]-P[1];let s=Infinity;
  if(dx>0)s=Math.min(s,(b.r-P[0])/dx);if(dx<0)s=Math.min(s,(b.l-P[0])/dx);
  if(dy>0)s=Math.min(s,(b.b-P[1])/dy);if(dy<0)s=Math.min(s,(b.t-P[1])/dy);
  return[P[0]+s*dx,P[1]+s*dy];}

function drawNode(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity'){
    mk('rect',{x:n.x-hw-8,y:n.y-hh-8,width:n.w,height:n.h,fill:C.entB});
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.ent,stroke:C.entB,'stroke-width':2.5});
    txt(n.x,n.y,n.label,{fs:27,fw:700,fill:'#1a1a1a'});
  }else if(n.type==='process'){
    const fill=n.manual?C.man:C.proc, st=n.manual?C.manB:C.procB;
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,rx:16,fill,stroke:st,'stroke-width':2.5});
    mk('line',{x1:n.x-hw,y1:n.y-hh+40,x2:n.x+hw,y2:n.y-hh+40,stroke:st,'stroke-width':2});
    txt(n.x,n.y-hh+20,n.num,{fs:22,fw:700});
    let ib=0;
    if(n.impl&&PHYS){const nl=n.impl.split('\n').length;ib=12+nl*19;
      mk('line',{x1:n.x-hw,y1:n.y+hh-ib,x2:n.x+hw,y2:n.y+hh-ib,stroke:st,'stroke-width':1.5});
      txt(n.x,n.y+hh-ib/2,n.impl,{fs:16,it:1,fill:n.manual?'#444':'#6b5410'});}
    txt(n.x,(n.y-hh+40+n.y+hh-ib)/2,n.label,{fs:n.fs||25,fw:700,fill:'#1a1a1a'});
  }else{
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.store});
    const st={stroke:C.storeB,'stroke-width':2.5};
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x+hw,y2:n.y-hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y+hh,x2:n.x+hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x-hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw+62,y1:n.y-hh,x2:n.x-hw+62,y2:n.y+hh},st));
    txt(n.x-hw+31,n.y,n.num,{fs:23,fw:700});
    const tb=PHYS?n.tables:n.tables.toUpperCase();
    const tall=n.h>=100, ty=tall?n.y-hh+26:n.y-12;
    txt(n.x-hw+78,ty,n.label,{fs:22,fw:700,anchor:'start',fill:'#1a1a1a'});
    txt(n.x-hw+78,ty+26+(tb.split('\n').length-1)*10,tb,{fs:16,anchor:'start',fill:'#2e5a1c',ff:MONO});
  }}

function entry(n,p){const b=bounds(n);
  if(n.type==='store')return[p[0]<n.x?n.x-n.w/2:n.x+n.w/2,p[1]];
  if(p[0]>=b.l&&p[0]<=b.r)return[p[0],p[1]<n.y?b.t:b.b];
  return[p[0]<n.x?b.l:b.r,p[1]];}
function drawRoute(f,N){const A=N[f.from],B=N[f.to],w=f.pts;
  const pts=[entry(A,w[0]),...w,entry(B,w[w.length-1])];
  mk('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  for(let i=1;i<pts.length;i++)SEGS.push({a:pts[i-1],b:pts[i],f});
  if(f.label)txt(f.lp[0],f.lp[1],f.label,{fs:f.fs||FS,halo:1,anchor:f.la||'middle'});}

function drawFlow(f,N){if(f.pts)return drawRoute(f,N);const A=N[f.from],B=N[f.to];let PA,PB;
  if(f.y!=null){PA=[A.x,f.y];PB=[B.x,f.y];}
  else if(f.x!=null){PA=[f.x,A.y];PB=[f.x,B.y];}
  else{const ao=f.ao||[0,0],bo=f.bo||ao;PA=[A.x+ao[0],A.y+ao[1]];PB=[B.x+bo[0],B.y+bo[1]];}
  const storeLink=(A.type==='store'||B.type==='store')&&f.x==null&&f.y==null;
  const anc=(n,o,off)=>{if(!storeLink)return null;const lim=n.type==='store'?n.h/2-8:n.h/2-12;
    return[o.x<n.x?n.x-n.w/2:n.x+n.w/2,n.y+Math.max(-lim,Math.min(lim,off?off[1]:0))];};
  const sa=anc(A,B,f.ao),sb=anc(B,A,f.bo||f.ao);
  const p1=sa||exitPt(A,PA,sb||PB),p2=sb||exitPt(B,PB,sa||PA);
  mk('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});SEGS.push({a:p1,b:p2,f});
  if(!f.label)return;
  if(PENDING&&f.x==null&&f.y==null){PENDING.push({f,p1,p2});return;}
  const t=f.t??0.5,mx=p1[0]+(p2[0]-p1[0])*t,my=p1[1]+(p2[1]-p1[1])*t;
  const fs=f.fs||FS,nl=f.label.split('\n').length,lh=fs*1.18;
  const vert=Math.abs(p2[0]-p1[0])<2;
  if(vert)return txt(mx+12,my+(f.ly||0),f.label,{fs,halo:1,anchor:'start'});
  const ly=f.lpos==='below'?my+nl*lh/2+5:my-nl*lh/2-5;
  txt(mx+(f.lx||0),ly,f.label,{fs,halo:1});
}

function boundary(b){
  mk('rect',{x:b[0],y:b[1],width:b[2],height:b[3],rx:28,fill:'none',stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'16 9'});
  txt(b[0]+b[2]-24,b[1]+b[3]-14,'Human–machine boundary: QuickPhone web app and database',{fs:17,fw:700,anchor:'end',fill:C.hmb,halo:1});
}

  txt(x+18,y+28,PHYS?'Physical DFD symbols (Gane and Sarson)':'Logical DFD symbols (Gane and Sarson)',{fs:19,fw:700,anchor:'start'});
  const c2=x+300;
  mk('rect',{x:x+18,y:y+50,width:52,height:34,fill:C.entB});mk('rect',{x:x+24,y:y+56,width:52,height:34,fill:C.ent,stroke:C.entB,'stroke-width':2});
  txt(x+92,y+72,'External entity',{fs:17,anchor:'start'});
  mk('rect',{x:x+24,y:y+100,width:52,height:38,rx:8,fill:C.proc,stroke:C.procB,'stroke-width':2});
  mk('line',{x1:x+24,y1:y+112,x2:x+76,y2:y+112,stroke:C.procB,'stroke-width':1.5});
  txt(x+92,y+120,PHYS?'Automated process':'Process',{fs:17,anchor:'start'});
  mk('rect',{x:c2,y:y+52,width:86,height:38,fill:C.store});['M0,0H86','M0,38H86','M0,0V38','M18,0V38'].forEach(d=>mk('path',{d,transform:`translate(${c2},${y+52})`,stroke:C.storeB,'stroke-width':2,fill:'none'}));
  txt(c2+100,y+72,'Data store (ERD entities listed)',{fs:16,anchor:'start'});
  mk('line',{x1:c2,y1:y+120,x2:c2+84,y2:y+120,stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  txt(c2+100,y+120,'Data flow (one way)',{fs:17,anchor:'start'});
  if(!PHYS)return;
  mk('rect',{x:x+24,y:y+160,width:52,height:38,rx:8,fill:C.man,stroke:C.manB,'stroke-width':2});
  txt(x+92,y+180,'Manual process',{fs:17,anchor:'start'});
  mk('line',{x1:c2,y1:y+180,x2:c2+84,y2:y+180,stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'12 7'});
  txt(c2+100,y+180,'Human–machine boundary',{fs:17,anchor:'start'});
  txt(x+18,y+232,'Bottom band of a process = how it is implemented and by whom.',{fs:15,anchor:'start',fill:'#555',it:1});
}

    const nm=id=>{const x=N[id],l=x.label.replace(/\n/g,' ');return x.type==='entity'?l:x.num+' '+l;};
