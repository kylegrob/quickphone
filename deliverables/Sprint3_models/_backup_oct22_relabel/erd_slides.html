<script>
// QuickPhone ERD, slide edition (Sprint 3 rev. 2): 16 entities, each held by exactly one DFD data store.
//   ?v=log|phys  logical (CamelCase, generic types) or physical (snake_case, SQL types, NOT NULL)
//   ?s=overview  every entity inside its DFD store container, with relationships
//   ?s=1|2|3     full attributes for one group of stores (readable on a 16:9 slide)
const NS='http://www.w3.org/2000/svg', MONO="Consolas,'Courier New',monospace";
const Q=new URLSearchParams(location.search), PHYS=Q.get('v')!=='log', VIEW=Q.get('s')||'overview';
let W=1920,H=1080;
let root;
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e;}
function txt(x,y,s,o={}){const a={x,y,'font-size':o.fs||20,'font-weight':o.fw||400,'text-anchor':o.anchor||'start',fill:o.fill||'#222'};
  if(o.ff)a['font-family']=o.ff;if(o.it)a['font-style']='italic';const t=mk('text',a);t.textContent=s;return t;}

// ---- DFD data stores (same numbering as the DFDs) ----
const STORES={D1:['Customers & Devices','#2e6b4f'],D2:['Appointments','#5a7d2a'],D3:['Repair Jobs','#8a5a00'],
  D4:['Parts Inventory','#2d5f8a'],D5:['Purchase Orders','#8b3a2b'],D6:['Suppliers','#5b4a8a'],D7:['Staff & Stores','#1f4e79']};
// ---- entities: [key, physical name, SQL type, NOT NULL, physical-only (1) or derived and physical-only (2)] ----
// Derived attributes (2) break 3NF (SAD 8e App. 5A), so the logical model omits them; the physical model
// stores them as documented denormalizations (SAD 8e Ch. 10).
const E={
 store:['D7',[['PK','store_id','INTEGER',1],['UK','store_name','VARCHAR(60)',1],['','address','VARCHAR(200)',1],['','phone','VARCHAR(20)',1],['','email_address','VARCHAR(120)',1],['','business_hours','VARCHAR(120)',0]]],
 employee:['D7',[['PK','employee_id','INTEGER',1],['FK store','store_id','INTEGER',1],['','first_name','VARCHAR(40)',1],['','last_name','VARCHAR(40)',1],['UK','email','VARCHAR(120)',1],['CK','role','VARCHAR(12)',1],['','password_hash','VARCHAR(255)',1,1],['','active_flag','BOOLEAN',1]]],
 customer:['D1',[['PK','customer_id','INTEGER',1],['','first_name','VARCHAR(40)',1],['','last_name','VARCHAR(40)',1],['IX','phone','VARCHAR(20)',1],['','email','VARCHAR(120)',0],['','created_at','TIMESTAMP',1]]],
 device:['D1',[['PK','device_id','INTEGER',1],['FK customer','customer_id','INTEGER',1],['','device_type','VARCHAR(20)',1],['','brand','VARCHAR(40)',1],['','model','VARCHAR(60)',1],['IX','serial_or_imei','VARCHAR(40)',0]]],
 appointment:['D2',[['PK','appointment_id','INTEGER',1],['FK customer','customer_id','INTEGER',1],['FK store','store_id','INTEGER',1],['FK employee','technician_id','INTEGER',1],['','scheduled_at','TIMESTAMP',1],['CK','appt_status','VARCHAR(12)',1]]],
 repair_job:['D3',[['PK','repair_job_id','INTEGER',1],['UK','ticket_number','VARCHAR(12)',1],['FK device','device_id','INTEGER',1],['FK store','store_id','INTEGER',1],['FK,UK appt.','appointment_id','INTEGER',0],['FK employee','assigned_tech_id','INTEGER',1],['CK','status','VARCHAR(20)',1,2],['','reported_issue','VARCHAR(500)',1],['','intake_condition','VARCHAR(500)',0],['','diagnosis_notes','VARCHAR(2000)',0],['','repair_notes','VARCHAR(2000)',0],['','check_in_at','TIMESTAMP',1],['','completed_at','TIMESTAMP',0],['','final_cost','DECIMAL(10,2)',0],['','email_sent_at','TIMESTAMP',0],['FK employee','email_sent_by_id','INTEGER',0],['CK','email_status','VARCHAR(10)',0],['','picked_up_at','TIMESTAMP',0],['','id_verified_flag','BOOLEAN',1],['','signature_file','VARCHAR(255)',0]]],
 job_status_history:['D3',[['PK','history_id','BIGINT',1],['FK repair_job','repair_job_id','INTEGER',1],['CK','status','VARCHAR(20)',1],['FK employee','changed_by_id','INTEGER',1],['','changed_at','TIMESTAMP',1],['','note','VARCHAR(300)',0]]],
 quote:['D3',[['PK','quote_id','INTEGER',1],['FK repair_job','repair_job_id','INTEGER',1],['','labor_amount','DECIMAL(10,2)',1],['','parts_amount','DECIMAL(10,2)',1],['','total_amount','DECIMAL(10,2)',1,2],['CK','decision','VARCHAR(10)',1],['','decision_at','TIMESTAMP',0],['FK employee','decision_by_id','INTEGER',0]]],
 payment:['D3',[['PK','payment_id','INTEGER',1],['FK repair_job','repair_job_id','INTEGER',1],['','amount','DECIMAL(10,2)',1],['CK','method','VARCHAR(12)',1],['CK','payment_status','VARCHAR(10)',1],['','paid_at','TIMESTAMP',1]]],
 job_part:['D3',[['PK','job_part_id','INTEGER',1],['FK repair_job','repair_job_id','INTEGER',1],['FK part','part_id','INTEGER',1],['FK purch._order','purchase_order_id','INTEGER',0],['','quantity','INTEGER',1],['CK','part_status','VARCHAR(8)',1],['','recorded_at','TIMESTAMP',1]]],
 part:['D4',[['PK','part_id','INTEGER',1],['FK supplier','default_supplier_id','INTEGER',0],['','part_name','VARCHAR(100)',1],['','device_model','VARCHAR(60)',0],['','grade','VARCHAR(20)',0],['','standard_cost','DECIMAL(10,2)',1],['','active_flag','BOOLEAN',1]]],
 store_part_stock:['D4',[['PK,FK store','store_id','INTEGER',1],['PK,FK part','part_id','INTEGER',1],['CK','quantity_on_hand','INTEGER',1,2],['','reorder_point','INTEGER',1]]],
 inventory_txn:['D4',[['PK','inventory_txn_id','BIGINT',1],['FK stock','store_id','INTEGER',1],['FK stock','part_id','INTEGER',1],['FK employee','recorded_by_id','INTEGER',1],['CK','txn_type','VARCHAR(12)',1],['','quantity_change','INTEGER',1],['','reason','VARCHAR(200)',0],['','txn_at','TIMESTAMP',1]]],
 supplier:['D6',[['PK','supplier_id','INTEGER',1],['UK','supplier_name','VARCHAR(100)',1],['','contact_name','VARCHAR(80)',0],['','phone','VARCHAR(20)',0],['','email','VARCHAR(120)',0],['','active_flag','BOOLEAN',1]]],
 purchase_order:['D5',[['PK','purchase_order_id','INTEGER',1],['FK store','store_id','INTEGER',1],['FK supplier','supplier_id','INTEGER',1],['FK employee','created_by_id','INTEGER',1],['FK employee','approved_by_id','INTEGER',0],['CK','po_status','VARCHAR(20)',1],['','created_at','TIMESTAMP',1],['','approved_at','TIMESTAMP',0],['','placed_at','TIMESTAMP',0],['','rejection_reason','VARCHAR(300)',0]]],
 po_line:['D5',[['PK','po_line_id','INTEGER',1],['FK purch._order','purchase_order_id','INTEGER',1],['FK part','part_id','INTEGER',1],['','quantity_ordered','INTEGER',1],['','quantity_received','INTEGER',1],['','unit_cost','DECIMAL(10,2)',1]]]};
const camel=n=>n.split('_').map(w=>w==='id'?'ID':w==='imei'?'IMEI':w==='po'?'PO':w[0].toUpperCase()+w.slice(1)).join('');
const gtype=t=>/INT/.test(t)?'int':/CHAR/.test(t)?'string':/DECIMAL/.test(t)?'decimal':/TIMESTAMP/.test(t)?'datetime':/BOOL/.test(t)?'boolean':t;
const ename=id=>PHYS?id:id.toUpperCase();
const cols=id=>E[id][1].filter(c=>PHYS||!c[4]);

// ---- crow's foot markers on any line direction ----
const LINE='#3a3a3a';
function marker(P,ux,uy,kind){ // P on the box edge, (ux,uy) unit vector pointing away from the box
  const px=-uy,py=ux,L=(a,b,c,d)=>mk('line',{x1:a,y1:b,x2:c,y2:d,stroke:LINE,'stroke-width':2.2});
  const at=d=>[P[0]+ux*d,P[1]+uy*d];
  const bar=d=>{const [x,y]=at(d);L(x+px*10,y+py*10,x-px*10,y-py*10);};
  const ring=d=>{const [x,y]=at(d);mk('circle',{cx:x,cy:y,r:6,fill:'#fff',stroke:LINE,'stroke-width':2.2});};
  if(kind==='1'){bar(10);bar(18);}
  else if(kind==='Z1'){bar(10);ring(25);}
  else{const [x,y]=at(20);L(x,y,P[0]+px*11,P[1]+py*11);L(x,y,P[0]-px*11,P[1]-py*11);L(x,y,P[0],P[1]);
    if(kind==='M1')bar(27);else ring(29);}
}
function edge(b,toward){ // box b {x,y,w,h} centre-based; exit point toward a point
  const dx=toward[0]-b.x,dy=toward[1]-b.y,s=Math.min(Math.abs((b.w/2)/(dx||1e-9)),Math.abs((b.h/2)/(dy||1e-9)));
  return[b.x+dx*s,b.y+dy*s];}
function link(A,B,ka,kb,o={}){ // straight line between two boxes, markers at both ends
  const a=edge(A,[B.x+(o.bx||0),B.y+(o.by||0)]),b=edge(B,[A.x+(o.ax||0),A.y+(o.ay||0)]);
  const ax=o.ao?[A.x+o.ao[0],A.y+o.ao[1]]:a, bx=o.bo?[B.x+o.bo[0],B.y+o.bo[1]]:b;
  mk('line',{x1:ax[0],y1:ax[1],x2:bx[0],y2:bx[1],stroke:LINE,'stroke-width':2.2});
  const L=Math.hypot(bx[0]-ax[0],bx[1]-ax[1]);
  return()=>{marker(ax,(bx[0]-ax[0])/L,(bx[1]-ax[1])/L,ka);marker(bx,(ax[0]-bx[0])/L,(ax[1]-bx[1])/L,kb);};
}
function ortho(pts,ka,kb){ // orthogonal route; first/last points sit on box edges
  mk('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:LINE,'stroke-width':2.2});
  const u=(p,q)=>{const L=Math.hypot(q[0]-p[0],q[1]-p[1]);return[(q[0]-p[0])/L,(q[1]-p[1])/L];};
  const n=pts.length;return()=>{const a=u(pts[0],pts[1]),b=u(pts[n-1],pts[n-2]);marker(pts[0],a[0],a[1],ka);marker(pts[n-1],b[0],b[1],kb);};
}

// Relationship verb (SAD 8e Ch. 5, Step 3): one active verb per line, read from the "one" (parent) side to the
// "many" (child) side, e.g. "a STORE employs EMPLOYEEs". rot: written along a vertical line.
function rel(x,y,s,o={}){
  const a={x,y,'font-size':19,'font-weight':600,'font-style':'italic','text-anchor':o.anchor||'middle','dominant-baseline':'central',
    fill:'#7a3b00',stroke:'#fff','stroke-width':7,'stroke-linejoin':'round','paint-order':'stroke'};
  if(o.rot)a.transform=`rotate(-90 ${x} ${y})`;
  mk('text',a).textContent=s;}

function header(title,sub){
  txt(40,48,title,{fs:34,fw:700,fill:'#1f4e79'});
  if(sub)txt(40,84,sub,{fs:20,fill:'#555'});
}

// =================== overview ===================
function overview(){
  header(PHYS?'QuickPhone — Physical ERD overview: 16 tables in 7 DFD data stores':'QuickPhone — Logical ERD overview: 16 entities in 7 DFD data stores',
    'Each shaded box is a DFD data store holding exactly these entities. Each verb reads from the "one" side to the "many" side. Attributes are on the detail slides.');
  const C=(id,x,y,w,h)=>{const [nm,col]=STORES[id];
    mk('rect',{x,y,width:w,height:h,rx:16,fill:col,'fill-opacity':0.07,stroke:col,'stroke-width':2.5,'stroke-dasharray':'10 6'});
    mk('rect',{x:x+14,y:y-16,width:nm.length*11.5+70,height:32,rx:8,fill:col});
    txt(x+26,y+7,id+'  '+nm,{fs:19,fw:700,fill:'#fff'});};
  C('D7',40,140,560,190);C('D1',660,140,560,190);C('D2',1280,140,600,190);
  C('D3',40,400,1840,250);
  C('D4',40,730,820,320);C('D5',920,730,560,320);C('D6',1540,730,340,320);
  const B={};const box=(id,x,y,w=240,h=62)=>{const col=STORES[E[id][0]][1];B[id]={x,y,w,h};
    mk('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:8,fill:'#fff',stroke:col,'stroke-width':3});
    mk('rect',{x:x-w/2,y:y-h/2,width:10,height:h,fill:col});
    txt(x+4,y+8,ename(id),{fs:21,fw:700,anchor:'middle',ff:PHYS?MONO:undefined});};
  // Boxes are spaced so every relationship line has room for its verb.
  box('store',150,245,200);box('employee',470,245,250);
  box('customer',790,245,200);box('device',1110,245,200);
  box('appointment',1580,245,270);
  box('job_status_history',300,470,320);box('quote',300,585);
  box('repair_job',960,525,400,80);
  box('payment',1600,470);box('job_part',1600,585);
  box('part',200,820,200);box('store_part_stock',600,820,280);box('inventory_txn',600,975,260);
  box('purchase_order',1200,820,300);box('po_line',1200,975,220);
  box('supplier',1710,890,230);
  const gl=mk('g',{}),gb=mk('g',{});
  // draw lines below boxes: move boxes group after
  const svg=document.getElementById('s');
  const R=[];root=gl;
  R.push(link(B.store,B.employee,'1','M0'));
  R.push(link(B.customer,B.device,'1','M0'));
  R.push(ortho([[740,276],[740,330],[1470,330],[1470,276]],'1','M0'));               // customer → appointment
  R.push(ortho([[1110,276],[1110,370],[1000,370],[1000,485]],'1','M0'));            // device → repair_job
  R.push(ortho([[1690,276],[1690,380],[1120,380],[1120,485]],'Z1','Z1'));           // appointment → repair_job
  R.push(ortho([[460,276],[460,360],[1600,360],[1600,276]],'1','M0'));              // employee (technician) → appointment
  R.push(ortho([[540,276],[540,350],[890,350],[890,485]],'1','M0'));                // employee (assigned tech) → repair_job
  R.push(ortho([[100,276],[100,710],[480,710],[480,789]],'1','M0'));                // store → store_part_stock
  R.push(ortho([[150,276],[150,690],[1080,690],[1080,789]],'1','M0'));              // store → purchase_order
  R.push(ortho([[230,276],[230,380],[790,380],[790,485]],'1','M0'));                // store → repair_job
  R.push(ortho([[220,214],[220,190],[1500,190],[1500,214]],'1','M0'));              // store → appointment
  R.push(link(B.repair_job,B.job_status_history,'1','M1'));
  R.push(link(B.repair_job,B.quote,'1','M0'));
  R.push(link(B.repair_job,B.payment,'1','M0'));
  R.push(link(B.repair_job,B.job_part,'1','M0'));
  R.push(link(B.part,B.store_part_stock,'1','M0'));
  R.push(link(B.store_part_stock,B.inventory_txn,'1','M0'));
  R.push(ortho([[200,851],[200,1010],[1050,1010],[1050,975],[1090,975]],'1','M0'));            // part → po_line
  R.push(ortho([[250,789],[250,700],[1520,700],[1520,616]],'1','M0'));              // part → job_part
  R.push(link(B.purchase_order,B.po_line,'1','M1'));
  R.push(ortho([[1290,789],[1290,680],[1660,680],[1660,616]],'Z1','M0'));          // purchase_order → job_part
  R.push(ortho([[1710,859],[1710,820],[1350,820]],'1','M0'));            // supplier → purchase_order
  R.push(ortho([[1640,921],[1640,1030],[150,1030],[150,851]],'Z1','M0'));          // supplier → part (default)
  root=gb;
  // boxes on top of lines
  svg.appendChild(gl);svg.appendChild(gb);
  root=svg;R.forEach(f=>f());
  // re-draw boxes on top
  root=svg;Object.entries(B).forEach(([id,b])=>{const col=STORES[E[id][0]][1];
    mk('rect',{x:b.x-b.w/2,y:b.y-b.h/2,width:b.w,height:b.h,rx:8,fill:'#fff',stroke:col,'stroke-width':3});
    mk('rect',{x:b.x-b.w/2,y:b.y-b.h/2,width:10,height:b.h,fill:col});
    txt(b.x+4,b.y+8,ename(id),{fs:21,fw:700,anchor:'middle',ff:PHYS?MONO:undefined});});
  // relationship verbs, parent → child
  [[297,220,'employs'],[950,220,'owns'],[1100,178,'schedules'],
   [1478,322,'books','start'],[1608,322,'handles','start'],
   [798,425,'takes in','start'],[898,425,'works on','start'],[1008,425,'undergoes','start'],[1128,425,'leads to','start'],
   [610,480,'tracks'],[590,580,'generates'],[1320,478,'receives'],[1320,580,'uses'],
   [496,765,'holds','start'],[1096,765,'issues','start'],[1536,632,'supplies','start'],[1676,632,'fills','start'],
   [380,798,'appears in'],[610,897,'logs','start'],[208,955,'appears on','start'],
   [1210,897,'contains','start'],[1610,802,'fulfills'],[1648,980,'provides','start']]
   .forEach(([x,y,s,a])=>rel(x,y,s,{anchor:a}));
  // audit note
  txt(40,1072,'Not drawn: audit links in which an EMPLOYEE changes a status, decides a QUOTE, sends the completion email, records an INVENTORY_TXN, or creates or approves a PURCHASE_ORDER (FKs on the detail slides).',{fs:17,fill:'#555'});
}

// =================== detail slides ===================
const TWD=560,HD=44,RH=30;
function table(id,x,y){const [st]=E[id],[sn,col]=STORES[st],cs=cols(id),h=HD+cs.length*RH+8;
  mk('rect',{x,y,width:TWD,height:h,fill:'#fff',stroke:col,'stroke-width':2.5,rx:6});
  mk('rect',{x,y,width:TWD,height:HD,fill:col,rx:6});mk('rect',{x,y:y+HD-8,width:TWD,height:8,fill:col});
  txt(x+14,y+31,ename(id),{fs:23,fw:700,fill:'#fff',ff:MONO});
  txt(x+TWD-12,y+30,st+' '+sn,{fs:17,fw:700,fill:'#fff',anchor:'end'});
  cs.forEach((c,i)=>{const ry=y+HD+i*RH;
    if(c[0].startsWith('PK'))mk('rect',{x:x+1.5,y:ry,width:TWD-3,height:RH,fill:'#fff6d6'});
    if(i>0)mk('line',{x1:x+1.5,y1:ry,x2:x+TWD-1.5,y2:ry,stroke:'#e4e4e4'});
    let [kk,...ref]=c[0].split(' ');
    if(!PHYS)kk=kk.split(',').filter(k=>k!=='CK'&&k!=='IX').join(','); // logical: identifiers and keys only
    txt(x+10,ry+21,kk,{fs:16,fw:700,fill:kk.includes('PK')?'#8a5a00':kk.includes('FK')?'#1f4e79':'#666'});
    txt(x+100,ry+21,PHYS?c[1]:camel(c[1]),{fs:19,fw:c[0].startsWith('PK')?700:400,ff:MONO,fill:'#1a1a1a'});
    if(PHYS)txt(x+315,ry+21,c[2],{fs:17,ff:MONO,fill:'#444'});            // logical: no data types
    const rn={'appt.':'appointment','purch._order':'purchase_order','stock':'store_part_stock'}[ref.join(' ')]||ref.join(' ');
    if(ref.length)txt(x+TWD-10,ry+21,'→ '+(PHYS?rn:rn.toUpperCase()),{fs:15,it:1,fill:'#1f4e79',anchor:'end'});
    else if(c[4]===2)txt(x+TWD-10,ry+21,'derived · NN',{fs:14,fw:700,fill:'#b0503a',anchor:'end'});
    else if(c[3]&&PHYS)txt(x+TWD-10,ry+21,'NN',{fs:14,fw:700,fill:'#999',anchor:'end'});
  });
  return{x,y,w:TWD,h,row:n=>y+HD+cs.findIndex(c=>c[1]===n)*RH+RH/2};
}
function detail(n){
  const T={},g={1:['Customers, devices, appointments, staff and stores','D1 Customers & Devices · D2 Appointments · D7 Staff & Stores'],
    2:['Repair jobs','D3 Repair Jobs: the job, its status history, quotes, payment and parts'],
    3:['Parts, purchasing and suppliers','D4 Parts Inventory · D5 Purchase Orders · D6 Suppliers']}[n];
  header(`QuickPhone — ${PHYS?'Physical':'Logical'} ERD detail ${n} of 3: ${g[0]}`,g[1]+'.   PK primary key · FK foreign key (→ table) · UK unique'+(PHYS?' · CK checked value list · NN not null':''));
  const note=(x,y,lines)=>lines.forEach((s,i)=>txt(x,y+i*27,s,{fs:19,fill:i?'#444':'#1f4e79',fw:i?400:700}));
  if(n==1)note(60,850,['Assumption to confirm with the owner',
    'StoreID is each employee\'s home store. The Owner role sees both stores;',
    'whether a Manager covers one store or both is still open.']);
  if(n==2)note(1300,820,PHYS?['Derived columns (denormalized on purpose)',
    'status = latest job_status_history row;',
    'total_amount = labor + parts. Stored so queues',
    'load fast and an approved quote cannot drift;',
    'the application keeps them in step. The logical',
    'ERD omits them (3NF).']
   :['Kept in 3NF: no derived attributes',
    'Current status is the latest JOB_STATUS_HISTORY',
    'row and a quote total is LaborAmount +',
    'PartsAmount, so neither is stored here. The',
    'physical model stores both as documented',
    'denormalizations.']);
  if(n==3)note(60,830,PHYS?['Derived column (denormalized on purpose)',
    'quantity_on_hand = sum of quantity_change in',
    'inventory_txn for the store and part. Stored so',
    'stock checks are instant; every change still writes',
    'a transaction. The logical ERD omits it (3NF).']
   :['Kept in 3NF: no derived attributes',
    'Quantity on hand is the sum of QuantityChange in',
    'INVENTORY_TXN for the store and part, so it is',
    'not stored here. The physical model stores it as',
    'a documented denormalization.']);
  const gl=mk('g',{}),R=[];
  const c1=60,c2=680,c3=1300,r1=620,r2=1240,r3=1860;
  if(n==1){
    T.store=table('store',c1,140);T.employee=table('employee',c1,500);
    T.appointment=table('appointment',c2,330);
    T.customer=table('customer',c3,140);T.device=table('device',c3,520);
    root=gl;
    R.push(ortho([[c1,T.store.row('store_id')],[c1-30,T.store.row('store_id')],[c1-30,T.employee.row('store_id')],[c1,T.employee.row('store_id')]],'1','M0'));
    R.push(ortho([[r1,T.store.row('store_id')],[650,T.store.row('store_id')],[650,T.appointment.row('store_id')],[c2,T.appointment.row('store_id')]],'1','M0'));
    R.push(ortho([[r1,T.employee.row('employee_id')],[650,T.employee.row('employee_id')],[650,T.appointment.row('technician_id')],[c2,T.appointment.row('technician_id')]],'1','M0'));

  const svg=document.getElementById('s');svg.insertBefore(gl,svg.children[1]);
  root=svg;R.forEach(f=>f());

}
