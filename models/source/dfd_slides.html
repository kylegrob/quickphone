<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#fff;overflow:hidden}
svg{display:block}
text{font-family:'Segoe UI',Arial,sans-serif}
</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// QuickPhone DFDs, slide edition (Sprint 4 rev.). One spec, two views: ?v=log|phys, ?d=<diagram>.
// Built for 16:9 slides (1920x1080): labels >= 19px, process names 25px. Every entity and data store is drawn
// once per diagram. The 7 data stores match the ERD exactly: each store lists the entities it holds.
// Level 0 is shown whole (d=level0, a large poster for documents/PDF) and in three readable parts (l0a, l0b, l0c).
const NS='http://www.w3.org/2000/svg', MONO="Consolas,'Courier New',monospace";
const Q=new URLSearchParams(location.search), PHYS=Q.get('v')!=='log';
const C={ent:'#dce8f5',entB:'#1f4e79',proc:'#fff7de',procB:'#b8860b',man:'#f0f0f0',manB:'#666',
  store:'#e8f1e0',storeB:'#4d7a2e',line:'#333',hmb:'#c0392b'};
const TY=100;
let svg, root, PENDING=null, SEGS=[];
const pick=x=>Array.isArray(x)?(PHYS?x[1]:x[0]):x;
const keep=o=>!(o.phys&&!PHYS)&&!(o.log&&PHYS);
function segHitsRect(a,b,r,pad){const x0=r.x-pad,y0=r.y-pad,x1=r.x+r.width+pad,y1=r.y+r.height+pad;
  let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
  for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
    if(p===0){if(q<0)return false;continue;}const r2=q/p;
    if(p<0){if(r2>t1)return false;if(r2>t0)t0=r2;}else{if(r2<t0)return false;if(r2<t1)t1=r2;}}
  return true;}
// Store-flow labels are placed last: each slides along its own line (and to either side) to the spot touching
// the fewest nodes, labels and other flows' lines.
function placeLabels(N,scope,group){
  const pad=4,boxes=[];
  const hit=(a,b)=>a.x<b.x+b.width+pad&&b.x<a.x+a.width+pad&&a.y<b.y+b.height+pad&&b.y<a.y+a.height+pad;
  Object.values(N).forEach(n=>{const b=bounds(n);boxes.push({x:b.l,y:b.t,width:b.r-b.l,height:b.b-b.t});});
  [...scope.querySelectorAll(':scope > text')].forEach(t=>boxes.push(t.getBBox()));
  const ts=[0.5,0.42,0.58,0.34,0.66,0.26,0.74,0.18,0.82,0.12,0.88];
  PENDING.sort((a,b)=>Math.hypot(a.p2[0]-a.p1[0],a.p2[1]-a.p1[1])-Math.hypot(b.p2[0]-b.p1[0],b.p2[1]-b.p1[1]));
  PENDING.forEach(({f,p1,p2})=>{let best=null,bestS=1e9;
    const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1,nx=-(p2[1]-p1[1])/L,ny=(p2[0]-p1[0])/L;
    search: for(const off of [0,16,-16,30,-30])for(const t of ts){
      const x=p1[0]+(p2[0]-p1[0])*t+nx*off,y=p1[1]+(p2[1]-p1[1])*t+ny*off;
      const el=txt(x,y,f.label,{fs:f.fs||FS,halo:1},group),bb=el.getBBox();
      const s=10*boxes.filter(b=>hit(bb,b)).length+SEGS.filter(g=>g.f!==f&&segHitsRect(g.a,g.b,bb,2)).length+(off?0.5:0);
      if(s<bestS){if(best)best.el.remove();best={el,bb};bestS=s;}else el.remove();
      if(s===0)break search;}
    boxes.push(best.bb);});
}
let FS=19;
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e;}
function txt(x,y,s,o={},p){
  const lines=String(s).split('\n'), fs=o.fs||20, lh=fs*1.18;
  const a={'font-size':fs,'font-weight':o.fw||400,'text-anchor':o.anchor||'middle',fill:o.fill||'#222'};
  if(o.ff)a['font-family']=o.ff;
  if(o.it)a['font-style']='italic';
  if(o.halo){a.stroke='#fff';a['stroke-width']=7;a['stroke-linejoin']='round';a['paint-order']='stroke';}
  const t=mk('text',a,p);
  const y0=y-(lines.length-1)*lh/2+fs*0.35;
  lines.forEach((l,i)=>{const ts=mk('tspan',{x,y:y0+i*lh},t);ts.textContent=l;});
  return t;
}
// ---------- node builders ----------
const E=(id,x,y,label,o={})=>({id,type:'entity',x,y,w:o.w||250,h:o.h||130,label});
const P=(id,x,y,num,label,o={})=>({id,type:'process',x,y,w:o.w||320,h:o.h||(PHYS?172:160),num,label,fs:o.fs,impl:o.impl,manual:o.manual,phys:o.phys,log:o.log});
const STORE={
 d1:['D1','Customers & Devices','customer, device, device_model'],
 d2:['D2','Appointments','appointment'],
 d3:['D3','Repair Jobs','repair_job, job_status_history,\nquote, quote_line, payment,\njob_part'],
 d4:['D4','Parts Inventory','part, store_part_stock,\ninventory_txn'],
 d5:['D5','Purchase Orders','purchase_order, po_line'],
 d6:['D6','Suppliers','supplier'],
 d7:['D7','Staff & Stores','store, employee, screen_access']};
const S=(id,x,y,h,o={})=>{const [num,label,tables]=STORE[id];return {id,type:'store',x,y,w:o.w||440,h,num,label,tables};};
const F=(from,to,label,o={})=>Object.assign({from,to,label},o);

function bounds(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity')return{l:n.x-hw-8,r:n.x+hw,t:n.y-hh-8,b:n.y+hh};
  return{l:n.x-hw,r:n.x+hw,t:n.y-hh,b:n.y+hh};}
function exitPt(n,P,Q){const b=bounds(n),dx=Q[0]-P[0],dy=Q[1]-P[1];let s=Infinity;
  if(dx>0)s=Math.min(s,(b.r-P[0])/dx);if(dx<0)s=Math.min(s,(b.l-P[0])/dx);
  if(dy>0)s=Math.min(s,(b.b-P[1])/dy);if(dy<0)s=Math.min(s,(b.t-P[1])/dy);
  return[P[0]+s*dx,P[1]+s*dy];}

function drawNode(n){const hw=n.w/2,hh=n.h/2;
  if(n.type==='entity'){
    mk('rect',{x:n.x-hw-8,y:n.y-hh-8,width:n.w,height:n.h,fill:C.entB});
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.ent,stroke:C.entB,'stroke-width':2.5});
    txt(n.x,n.y,n.label,{fs:27,fw:700,fill:'#1a1a1a'});
  }else if(n.type==='process'){
    const fill=n.manual?C.man:C.proc, st=n.manual?C.manB:C.procB;
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,rx:16,fill,stroke:st,'stroke-width':2.5});
    mk('line',{x1:n.x-hw,y1:n.y-hh+40,x2:n.x+hw,y2:n.y-hh+40,stroke:st,'stroke-width':2});
    txt(n.x,n.y-hh+20,n.num,{fs:22,fw:700});
    let ib=0;
    if(n.impl&&PHYS){const nl=n.impl.split('\n').length;ib=12+nl*19;
      mk('line',{x1:n.x-hw,y1:n.y+hh-ib,x2:n.x+hw,y2:n.y+hh-ib,stroke:st,'stroke-width':1.5});
      txt(n.x,n.y+hh-ib/2,n.impl,{fs:16,it:1,fill:n.manual?'#444':'#6b5410'});}
    txt(n.x,(n.y-hh+40+n.y+hh-ib)/2,n.label,{fs:n.fs||25,fw:700,fill:'#1a1a1a'});
  }else{
    mk('rect',{x:n.x-hw,y:n.y-hh,width:n.w,height:n.h,fill:C.store});
    const st={stroke:C.storeB,'stroke-width':2.5};
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x+hw,y2:n.y-hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y+hh,x2:n.x+hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw,y1:n.y-hh,x2:n.x-hw,y2:n.y+hh},st));
    mk('line',Object.assign({x1:n.x-hw+62,y1:n.y-hh,x2:n.x-hw+62,y2:n.y+hh},st));
    txt(n.x-hw+31,n.y,n.num,{fs:23,fw:700});
    // table list wraps at ', ' to the visible width of the box (Consolas 16 px is about 8.8 px a character)
    const avT=Math.min(n.x+hw,+svg.getAttribute('width')-12)-(n.x-hw+78)-6,maxC=Math.max(12,Math.floor(avT/8.8));
    const tb=(PHYS?n.tables:n.tables.toUpperCase()).split('\n').map(l=>{const out=[];let cur='';
      l.split(', ').forEach((w,i,a)=>{const piece=w+(i<a.length-1?',':'');
        if(cur&&(cur+' '+piece).length>maxC){out.push(cur);cur=piece;}else cur=cur?cur+' '+piece:piece;});
      out.push(cur);return out.join('\n');}).join('\n');
    const tall=n.h>=100, ty=tall?n.y-hh+26:n.y-12;
    // Physical store names say how the store is implemented (SAD 8e Ch. 9 Step 1): tables in the PostgreSQL database
    // A name too wide for the visible part of the box goes onto two lines or shrinks, never below 19 px.
    const SA={fs:22,fw:700,anchor:'start',fill:'#1a1a1a'};let dy=0;
    const sn=txt(n.x-hw+78,ty,PHYS?'PostgreSQL: '+n.label:n.label,SA);
    if(PHYS){const av=Math.min(n.x+hw,+svg.getAttribute('width')-12)-(n.x-hw+78),len=sn.getComputedTextLength();
      if(len*19/22>av){sn.remove();const y2=tall?ty+13:n.y-14;txt(n.x-hw+78,y2,'PostgreSQL:\n'+n.label,SA);dy=tall?26:y2+36-(ty+26);}
      else if(len>av)sn.setAttribute('font-size',Math.max(19,Math.floor(22*av/len)));}
    txt(n.x-hw+78,ty+26+dy+(tb.split('\n').length-1)*10,tb,{fs:16,anchor:'start',fill:'#2e5a1c',ff:MONO});
  }}

function entry(n,p){const b=bounds(n);
  if(n.type==='store')return[p[0]<n.x?n.x-n.w/2:n.x+n.w/2,p[1]];
  if(p[0]>=b.l&&p[0]<=b.r)return[p[0],p[1]<n.y?b.t:b.b];
  return[p[0]<n.x?b.l:b.r,p[1]];}
function drawRoute(f,N){const A=N[f.from],B=N[f.to],w=f.pts;
  const pts=[entry(A,w[0]),...w,entry(B,w[w.length-1])];
  mk('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  for(let i=1;i<pts.length;i++)SEGS.push({a:pts[i-1],b:pts[i],f});
  if(f.label)txt(f.lp[0],f.lp[1],f.label,{fs:f.fs||FS,halo:1,anchor:f.la||'middle'});}

function drawFlow(f,N){if(f.pts)return drawRoute(f,N);const A=N[f.from],B=N[f.to];let PA,PB;
  if(f.y!=null){PA=[A.x,f.y];PB=[B.x,f.y];}
  else if(f.x!=null){PA=[f.x,A.y];PB=[f.x,B.y];}
  else{const ao=f.ao||[0,0],bo=f.bo||ao;PA=[A.x+ao[0],A.y+ao[1]];PB=[B.x+bo[0],B.y+bo[1]];}
  const storeLink=(A.type==='store'||B.type==='store')&&f.x==null&&f.y==null;
  const anc=(n,o,off)=>{if(!storeLink)return null;const lim=n.type==='store'?n.h/2-8:n.h/2-12;
    return[o.x<n.x?n.x-n.w/2:n.x+n.w/2,n.y+Math.max(-lim,Math.min(lim,off?off[1]:0))];};
  const sa=anc(A,B,f.ao),sb=anc(B,A,f.bo||f.ao);
  const p1=sa||exitPt(A,PA,sb||PB),p2=sb||exitPt(B,PB,sa||PA);
  mk('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});SEGS.push({a:p1,b:p2,f});
  if(!f.label)return;
  if(PENDING&&f.x==null&&f.y==null){PENDING.push({f,p1,p2});return;}
  const t=f.t??0.5,mx=p1[0]+(p2[0]-p1[0])*t,my=p1[1]+(p2[1]-p1[1])*t;
  const fs=f.fs||FS,nl=f.label.split('\n').length,lh=fs*1.18;
  const vert=Math.abs(p2[0]-p1[0])<2;
  if(vert)return txt(mx+12,my+(f.ly||0),f.label,{fs,halo:1,anchor:'start'});
  const ly=f.lpos==='below'?my+nl*lh/2+5:my-nl*lh/2-5;
  txt(mx+(f.lx||0),ly,f.label,{fs,halo:1});
}

// Right-angle routing for slide diagrams whose processes sit in one column with the data stores to their right
// (d.ortho). Each process–store flow leaves the process's right edge; it runs straight across when the store is level
// with its port, otherwise it turns into its own vertical lane just left of the stores. Its name sits on the first
// stretch beside the process, where no lane passes. The stores are moved and narrowed to make room for the lanes,
// and the lane order is searched for the fewest crossings (SAD 8e Ch. 4).
function textW(s,fs){const t=txt(-9999,-9999,s,{fs,halo:1});const w=t.getBBox().width;t.remove();return w;}
function orthoRoute(d,N){
  const LANE=18,GAP=22,isS=n=>n.type==='store',isP=n=>n.type==='process'&&!n.manual;
  const fl=d.flows.filter(f=>keep(f)&&!f.pts&&f.x==null&&f.y==null&&N[f.from]&&N[f.to]&&
    ((isS(N[f.from])&&isP(N[f.to]))||(isP(N[f.from])&&isS(N[f.to])))).map(f=>{const out=isP(N[f.from]);
    return{f,p:N[out?f.from:f.to],s:N[out?f.to:f.from],out};});
  const procs=[...new Set(fl.map(o=>o.p))];
  fl.forEach(o=>{o.f.label=pick(o.f.label).replace(/\n/g,' ');});
  procs.forEach(p=>{const fs=fl.filter(o=>o.p===p).sort((a,b)=>a.s.y-b.s.y||a.out-b.out);
    const top=p.y-p.h/2+50,bot=p.y+p.h/2-(PHYS&&p.impl?44:16),n=fs.length,sp=n>1?Math.min(36,(bot-top)/(n-1)):0;
    fs.forEach((o,i)=>o.py=(top+bot)/2+(i-(n-1)/2)*sp);});
  const PE=Math.max(...procs.map(p=>p.x+p.w/2));
  const LZ=Math.max(...fl.map(o=>textW(o.f.label,o.f.fs||FS)))+40;
  // store ports: straight across when the store is level with the process port, else the nearest free slot. A port
  // also keeps clear of every other flow's process port: its last stretch runs at that height, and if another flow's
  // first stretch ran there too the two lines would merge into one (PG = clearance).
  const PG=14,used=new Map();fl.forEach(o=>used.set(o.s,used.get(o.s)||[]));
  const free=(s,y,o)=>y>=s.y-s.h/2+12&&y<=s.y+s.h/2-12&&used.get(s).every(v=>Math.abs(v-y)>=GAP)&&fl.every(q=>q===o||Math.abs(q.py-y)>=PG);
  fl.sort((a,b)=>a.py-b.py).forEach(o=>{if(free(o.s,o.py,o)){o.sy=o.py;o.straight=1;used.get(o.s).push(o.py);}});
  fl.filter(o=>!o.straight).sort((a,b)=>Math.min(Math.abs(a.py-a.s.y+a.s.h/2),Math.abs(a.py-a.s.y-a.s.h/2))-Math.min(Math.abs(b.py-b.s.y+b.s.h/2),Math.abs(b.py-b.s.y-b.s.h/2)))
    .forEach(o=>{const s=o.s,lo=s.y-s.h/2+12,hi=s.y+s.h/2-12;let best=null;
      for(let y=lo;y<=hi;y+=2)if(free(s,y,o)&&(best==null||Math.abs(y-o.py)<Math.abs(best-o.py)))best=y;
      if(best==null)best=Math.max(lo,Math.min(hi,o.py));o.sy=best;used.get(s).push(best);});
  // lane order with the fewest crossings (same rule as the complete Level 0)
  const ln=fl.filter(o=>!o.straight);
  const inside=(v,f)=>v>Math.min(f.py,f.sy)+1&&v<Math.max(f.py,f.sy)-1;
  const cost=o=>{let c=0;for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++)c+=inside(o[j].py,o[i])+inside(o[i].sy,o[j]);return c;};
  let seed=11,best=ln.slice(),bc=cost(best);const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let r=0;r<40&&ln.length>1;r++){const o=ln.slice();if(r)o.sort(()=>rnd()-0.5);else o.sort((a,b)=>Math.abs(a.py-a.sy)-Math.abs(b.py-b.sy));
    let c=cost(o),imp=true;while(imp){imp=false;for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){[o[i],o[j]]=[o[j],o[i]];const c2=cost(o);if(c2<c){c=c2;imp=true;}else[o[i],o[j]]=[o[j],o[i]];}}
    if(c<bc){bc=c;best=o.slice();}}
  best.forEach((o,i)=>o.lx=PE+LZ+i*LANE);
  // stores fill the space right of the last lane
  const SL=PE+LZ+Math.max(0,best.length-1)*LANE+(best.length?40:0),SR=d.W-24;
  [...used.keys()].forEach(s=>{s.x=(SL+SR)/2;s.w=SR-SL;});
  fl.forEach(o=>{const f=o.f,x=o.straight?(PE+SL)/2:o.lx;
    f.pts=o.straight?[[x,o.py]]:(o.out?[[x,o.py],[x,o.sy]]:[[x,o.sy],[x,o.py]]);
    f.lp=[o.p.x+o.p.w/2+14,o.py-14];f.la='start';});
}

// Human-machine boundary (SAD 8e Ch. 9, Step 2; Figs. 9-2, 9-4): a dashed line around each person who uses the
// system's screens, so it separates human action from the automated processes. Manual processes are human action and
// sit inside the Front Desk's line. No line around the Customer: the customer only receives a printout and an email.
const NOUI=['cust'];
function humanBoundaries(nodes,H){
  const people=nodes.filter(n=>n.type==='entity'&&!NOUI.includes(n.id)),manual=nodes.filter(n=>n.manual);
  people.forEach(n=>{const grp=[n].concat(n.id==='fd'?manual:[]);
    let l=Math.min(...grp.map(g=>g.x-g.w/2-(g.type==='entity'?8:0)))-14,r=Math.max(...grp.map(g=>g.x+g.w/2))+14;
    let t=Math.min(...grp.map(g=>g.y-g.h/2-(g.type==='entity'?8:0)))-14,b=Math.max(...grp.map(g=>g.y+g.h/2))+14;
    l=Math.max(l,4);t=Math.max(t,-2);b=Math.min(b,H-4);
    mk('rect',{x:l,y:t,width:r-l,height:b-t,rx:14,fill:'none',stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'16 9'});});
}
// key at the right end of the subtitle row (drawn in page coordinates, above the diagram)
function boundaryKey(W,hdr){const x=W-30;
  const ends=hdr.map(t=>t?t.getBBox().x+t.getBBox().width:0); // [title row, subtitle row]
  for(const words of ['Human–machine boundary (around each person who uses the system’s screens)','Human–machine boundary'])
    for(const [row,y] of [[1,80],[0,42]]){
      const t=txt(x,y,words,{fs:17,fw:700,anchor:'end',fill:C.hmb}),w=t.getComputedTextLength();
      if(x-w-74>ends[row]+30){mk('line',{x1:x-w-74,y1:y,x2:x-w-14,y2:y,stroke:C.hmb,'stroke-width':3,'stroke-dasharray':'12 7'});return;}
      t.remove();}
}

function legend(x,y){
  const W=640,H=PHYS?250:150;
  mk('rect',{x,y,width:W,height:H,fill:'#fff',stroke:'#999','stroke-width':1.5});
  txt(x+18,y+28,PHYS?'Physical DFD symbols (Gane and Sarson)':'Logical DFD symbols (Gane and Sarson)',{fs:19,fw:700,anchor:'start'});
  const c2=x+300;
  mk('rect',{x:x+18,y:y+50,width:52,height:34,fill:C.entB});mk('rect',{x:x+24,y:y+56,width:52,height:34,fill:C.ent,stroke:C.entB,'stroke-width':2});
  txt(x+92,y+72,'External entity',{fs:17,anchor:'start'});
  mk('rect',{x:x+24,y:y+100,width:52,height:38,rx:8,fill:C.proc,stroke:C.procB,'stroke-width':2});
  mk('line',{x1:x+24,y1:y+112,x2:x+76,y2:y+112,stroke:C.procB,'stroke-width':1.5});
  txt(x+92,y+120,PHYS?'Automated process':'Process',{fs:17,anchor:'start'});
  mk('rect',{x:c2,y:y+52,width:86,height:38,fill:C.store});['M0,0H86','M0,38H86','M0,0V38','M18,0V38'].forEach(d=>mk('path',{d,transform:`translate(${c2},${y+52})`,stroke:C.storeB,'stroke-width':2,fill:'none'}));
  txt(c2+100,y+72,'Data store (ERD entities listed)',{fs:16,anchor:'start'});
  mk('line',{x1:c2,y1:y+120,x2:c2+84,y2:y+120,stroke:C.line,'stroke-width':2.2,'marker-end':'url(#arr)'});
  txt(c2+100,y+120,'Data flow (one way)',{fs:17,anchor:'start'});
  if(!PHYS)return;
  mk('rect',{x:x+24,y:y+160,width:52,height:38,rx:8,fill:C.man,stroke:C.manB,'stroke-width':2});

// ---------- Level 0, whole (poster for documents) ----------
// The complete Level 0 is laid out by code, not by hand. Every line runs only horizontally and vertically, so lines
// that must cross do so at right angles (SAD 8e Ch. 4: "minimize crossings ... cross at right angles"). Layout:
//   Front Desk | counter processes | label zone | lanes | data stores | lanes | label zone | bench & back-office processes | Technician, Manager
// Each process–store flow leaves its process horizontally, turns into its own vertical lane, and enters the store
// horizontally. Its name sits on the first horizontal stretch, next to the process, where no other line passes, and
// the "PostgreSQL Record: ..." name says which tables it touches. Lane order is chosen by search to give the fewest crossings.
D.level0=(()=>{
  // 5.0 sits last so its email drops straight down to the Customer and the Technician's send request can enter it
  // from below; 2.0's claim ticket takes the gap on the left
  // 9.0 sits last on the right so the Owner's labor and screen-access lines run straight up into it from below
  const LEFT=['p1','p8','p6','p2','p5'],RIGHT=['p3','p4','p7','p9'],SO=['d2','d1','d7','d3','d4','d6','d5'];
  const PS=42,SPS=24,LANE=19,LZ=375,EZ=360,PW=390,EW=250,SW=470,M=30,G=56;
  const keys=Object.keys(L0).filter(L0on);
  const isL=p=>LEFT.includes(p);
  // ---- flows on the inner (store-facing) edge of each process ----
  const sf=keys.filter(k=>k[0]==='s').map(k=>{const [a,b]=L0[k],out=a[0]==='p';return{k,p:out?a:b,s:out?b:a,out};});
  const inner={},outer={};[...LEFT,...RIGHT].forEach(p=>{inner[p]=[];outer[p]=[];});
  sf.forEach(f=>inner[f.p].push(f));
  inner.p3.unshift({k:'e3b',p:'p3',fd:1},{k:'e3a',p:'p3',fd:1});           // Front Desk lines run across the top into 3.0
  inner.p8.push({k:'e8d',p:'p8',s:'own',out:0},{k:'e8c',p:'p8',s:'own',out:1}); // Owner <-> 8.0 run in left lanes
  const ent={fd:LEFT,tech:['p3','p4'],mgr:['p9','p7']};
  keys.filter(k=>k[0]==='e').forEach(k=>{const [a,b]=L0[k],e=a[0]==='p'?b:a,p=a[0]==='p'?a:b;
    if(ent[e]&&ent[e].includes(p)&&!(e==='fd'&&p==='p3'))outer[p].push({k,p});});
  outer.p2.push({k:'e2d',p:'p2',cust:1});                                    // lowest port on 2.0's left edge
  const si=s=>s==='own'?99:SO.indexOf(s);
  [...LEFT,...RIGHT].forEach(p=>inner[p].sort((a,b)=>(a.fd?-1:b.fd?1:0)||si(a.s)-si(b.s)||(a.out-b.out)));
  // ---- vertical layout ----
  const ph=p=>Math.max(210,Math.max(inner[p].length,outer[p].length)*PS+112);
  const Y0=20, nodes={};
  let y=Y0;RIGHT.forEach(p=>{nodes[p]={y,h:ph(p)};y+=ph(p)+G;});
  const fdLines=[Y0+60,Y0+60+PS];                                          // ports 0 and 1 of 3.0
  y=fdLines[1]+70;LEFT.forEach(p=>{nodes[p]={y,h:ph(p)};y+=ph(p)+G;});
  const bottom=Math.max(...[...LEFT,...RIGHT].map(p=>nodes[p].y+nodes[p].h));
  // stretch the shorter column so both end level
  [LEFT,RIGHT].forEach(col=>{const last=nodes[col[col.length-1]],gap=bottom-(last.y+last.h);
    col.forEach((p,i)=>{nodes[p].y+=gap*i/(col.length-1);});});
  const port=(p,i,n)=>{const nd=nodes[p],top=nd.y+50,bot=nd.y+nd.h-(PHYS?54:22);return top+(bot-top)/2+(i-(n-1)/2)*PS;};
  [...LEFT,...RIGHT].forEach(p=>{inner[p].forEach((f,i)=>f.py=port(p,i,inner[p].length));outer[p].forEach((f,i)=>f.py=port(p,i,outer[p].length));});
  // stores: as close as possible to the mean height of the ports that use them, in fixed order, no overlap
  const sh=s=>{const n=Math.max(sf.filter(f=>f.s===s&&isL(f.p)).length,sf.filter(f=>f.s===s&&!isL(f.p)).length);return Math.max(96,n*SPS+48);};
  const sTop=fdLines[1]+60;
  let st=SO.map(s=>{const ps=sf.filter(f=>f.s===s).map(f=>f.py);return{s,h:sh(s),c:ps.reduce((a,b)=>a+b,0)/ps.length};});
  let cur=sTop;st.forEach(o=>{o.y=Math.max(cur,o.c-o.h/2);cur=o.y+o.h+34;});
  const over=cur-34-bottom;if(over>0)for(let i=st.length-1,lim=bottom;i>=0;i--){const o=st[i];if(o.y+o.h>lim)o.y=lim-o.h;lim=o.y-34;}
  st.forEach(o=>nodes[o.s]={y:o.y,h:o.h});
  // store ports, ordered by the height of the process port on each side. The set is shifted up or down (within the
  // store) until no port sits level with another flow's process port on that side, where the two lines would merge.
  SO.forEach(s=>['L','R'].forEach(sd=>{const fs=sf.filter(f=>f.s===s&&isL(f.p)===(sd==='L')).sort((a,b)=>a.py-b.py);
    const side=sf.filter(f=>isL(f.p)===(sd==='L')),nd=nodes[s],room=Math.max(0,nd.h/2-14-(fs.length-1)/2*SPS);
    const at=(f,i,dy)=>nd.y+nd.h/2+dy+(i-(fs.length-1)/2)*SPS;
    const clear=dy=>fs.every((f,i)=>side.every(q=>q===f||Math.abs(q.py-at(f,i,dy))>=14));
    let dy=0;for(let t=0;t<=room;t+=2){if(clear(t)){dy=t;break;}if(clear(-t)){dy=-t;break;}}
    fs.forEach((f,i)=>f.sy=at(f,i,dy));}));
  // where a store had no room to shift the whole set, move just the clashing port, by the least amount that keeps it
  // 10 px from every other process port and store port on that side and inside the store
  sf.forEach(f=>{const side=sf.filter(q=>q!==f&&isL(q.p)===isL(f.p)),nd=nodes[f.s];
    const ok=y=>y>=nd.y+10&&y<=nd.y+nd.h-10&&side.every(q=>Math.abs(q.py-y)>=10&&(q.s!==f.s||Math.abs(q.sy-y)>=10));
    if(ok(f.sy))return;for(let t=1;t<=SPS;t++){if(ok(f.sy-t)){f.sy-=t;return;}if(ok(f.sy+t)){f.sy+=t;return;}}});
  // ---- horizontal layout ----
  const routed={L:[],R:[]};[...LEFT,...RIGHT].forEach(p=>inner[p].filter(f=>!f.fd).forEach(f=>routed[isL(p)?'L':'R'].push(f)));
  const Yb=bottom+200;
  routed.L.find(f=>f.k==='e8d').sy=Yb-20;routed.L.find(f=>f.k==='e8c').sy=Yb+20;
  // lane order with the fewest crossings: a is nearer the process than b; b's first leg crosses a's lane when b's
  // process port lies inside a's vertical span; a's last leg crosses b's lane when a's store port lies inside b's span
  const inside=(v,f)=>v>Math.min(f.py,f.sy)+1&&v<Math.max(f.py,f.sy)-1;
  const cost=o=>{let c=0;for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){const a=o[i],b=o[j];c+=inside(b.py,a)+inside(a.sy,b);}return c;};
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  ['L','R'].forEach(sd=>{let best=null,bc=1e9;
    for(let r=0;r<60;r++){const o=routed[sd].slice();if(r)o.sort(()=>rnd()-0.5);else o.sort((a,b)=>Math.abs(a.py-a.sy)-Math.abs(b.py-b.sy));
      let c=cost(o),imp=true;
      while(imp){imp=false;for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){[o[i],o[j]]=[o[j],o[i]];const c2=cost(o);
        if(c2<c){c=c2;imp=true;}else[o[i],o[j]]=[o[j],o[i]];}}

// &check=1 lists every pair of flows whose lines run along the same stretch (within 4 px), which would make two flows
// read as one; render_slides.ps1 -Check runs it on every diagram.
function overlaps(){const out=[],ax=(g,i)=>[g.a[i],g.b[i]],hz=g=>Math.abs(g.a[1]-g.b[1])<1,vt=g=>Math.abs(g.a[0]-g.b[0])<1;
  for(let i=0;i<SEGS.length;i++)for(let j=i+1;j<SEGS.length;j++){const g=SEGS[i],h=SEGS[j];if(g.f.label===h.f.label&&g.f.from===h.f.from)continue;
    for(const [ok,c,r] of [[hz,1,0],[vt,0,1]]){if(!ok(g)||!ok(h)||Math.abs(g.a[c]-h.a[c])>4)continue;
      const [g1,g2]=ax(g,r).sort((a,b)=>a-b),[h1,h2]=ax(h,r).sort((a,b)=>a-b),len=Math.min(g2,h2)-Math.max(g1,h1);
      if(len>3)out.push([pick(g.f.label),pick(h.f.label),Math.round(g.a[c]),Math.round(len),[g.a,g.b,h.a,h.b].map(p=>p.map(Math.round).join(","))]);}}
  const p=document.createElement('pre');p.id='chk';p.textContent=JSON.stringify(out);document.body.appendChild(p);}
// ?d=dump lists every flow of the chosen view as JSON (diagram, from, to, name, Level 0 key), for the data flow

function dump(){const out=[];

    const nm=id=>{const x=N[id],l=x.label.replace(/\n/g,' ');return x.type==='entity'?l:x.num+' '+l;};
    [...d.flows,...(d.anch||[]).map(([kk])=>L(kk))].filter(keep)
      .forEach(f=>out.push({d:k,from:nm(f.from),to:nm(f.to),name:pick(f.label).replace(/\n/g,' '),k:f.k||''}));}
  document.body.innerHTML='<pre id="o"></pre>';document.getElementById('o').textContent=JSON.stringify(out);}
if(Q.get('d')==='dump')dump();else
