<section class="card">
  <h2>History</h2><p class="muted">Every status change, approval, payment and release, with who and when</p>
  <ul class="history">
    {% for h in history %}<li><span class="pill {{ h.status|slugify }}">{{ h.status }}</span> {{ h.note|default:"" }}
      <div class="muted small">{{ h.changed_by.first_name }} {{ h.changed_by.last_name }} ({{ h.changed_by.role }}) · {{ h.changed_at|date:"M j, g:i A" }}</div></li>{% endfor %}
  </ul>
</section>
