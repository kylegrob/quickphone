{% extends "shop/base.html" %}
{% block title %}{{ store }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ store }}</h1><p>The email address is the store's own account; pickup notifications are sent from it.</p></div><a class="btn" href="{% url 'staff' %}">Back</a></div>
<form method="post" class="card" style="max-width:820px">{% csrf_token %}
  <div class="row">
    <div><label for="n">Store name</label><input type="text" id="n" name="store_name" value="{{ store.store_name }}" maxlength="60" required></div>
    <div><label for="p">Phone</label><input type="tel" id="p" name="phone" value="{{ store.phone }}" maxlength="20" required></div>
    <div><label for="e">Email address</label><input type="email" id="e" name="email_address" value="{{ store.email_address }}" maxlength="120" required></div>
    <div><label for="h">Business hours (optional)</label><input type="text" id="h" name="business_hours" value="{{ store.business_hours|default:'' }}" maxlength="120"></div>
  </div>
  <label for="a">Address</label><input type="text" id="a" name="address" value="{{ store.address }}" maxlength="200" required>
  <p><button class="btn primary">Save store</button></p>
</form>
{% endblock %}
