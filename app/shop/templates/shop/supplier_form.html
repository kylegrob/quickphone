{% extends "shop/base.html" %}
{% block title %}{% if supplier.pk %}{{ supplier }}{% else %}Add supplier{% endif %}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{% if supplier.pk %}{{ supplier }}{% else %}Add a supplier{% endif %}</h1></div><a class="btn" href="{% url 'staff' %}">Back</a></div>
<form method="post" class="card" style="max-width:820px">{% csrf_token %}
  <div class="row">
    <div><label for="n">Supplier name</label><input type="text" id="n" name="supplier_name" value="{{ supplier.supplier_name|default:'' }}" maxlength="100" required></div>
    <div><label for="c">Contact name (optional)</label><input type="text" id="c" name="contact_name" value="{{ supplier.contact_name|default:'' }}" maxlength="80"></div>
    <div><label for="p">Phone (optional)</label><input type="tel" id="p" name="phone" value="{{ supplier.phone|default:'' }}" maxlength="20"></div>
    <div><label for="e">Email (optional)</label><input type="email" id="e" name="email" value="{{ supplier.email|default:'' }}" maxlength="120"></div>
  </div>
  {% if supplier.pk %}<label style="font-weight:400;display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" name="active_flag" {% if supplier.active_flag %}checked{% endif %} style="width:22px;height:22px"> Active</label>{% endif %}
  <p><button class="btn primary">Save supplier</button></p>
</form>
{% endblock %}
