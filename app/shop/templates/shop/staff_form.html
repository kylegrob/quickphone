{% extends "shop/base.html" %}
{% block title %}{% if employee.pk %}{{ employee }}{% else %}Add staff{% endif %}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{% if employee.pk %}{{ employee }}{% else %}Add a staff account{% endif %}</h1></div><a class="btn" href="{% url 'staff' %}">Back</a></div>
<form method="post" class="card" style="max-width:820px">{% csrf_token %}
  <div class="row">
    <div><label for="fn">First name</label><input type="text" id="fn" name="first_name" value="{{ employee.first_name|default:'' }}" maxlength="40" required></div>
    <div><label for="ln">Last name</label><input type="text" id="ln" name="last_name" value="{{ employee.last_name|default:'' }}" maxlength="40" required></div>
    <div><label for="em">Email (sign-in name)</label><input type="email" id="em" name="email" value="{{ employee.email|default:'' }}" maxlength="120" required></div>
    <div><label for="role">Role</label><select id="role" name="role">{% for r in roles %}<option {% if r == employee.role %}selected{% endif %}>{{ r }}</option>{% endfor %}</select></div>
    <div><label for="store">Home store</label><select id="store" name="store_id">{% for s in stores %}<option value="{{ s.pk }}" {% if s.pk == employee.store_id %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
    <div><label for="pw">{% if employee.pk %}New password (leave blank to keep){% else %}Starting password{% endif %}</label><input type="password" id="pw" name="password" autocomplete="new-password" minlength="8"></div>
  </div>
  {% if employee.pk %}<label style="font-weight:400;display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" name="active_flag" {% if employee.active_flag %}checked{% endif %} style="width:22px;height:22px"> Active (untick when someone leaves; their history stays)</label>{% endif %}
  <p><button class="btn primary">Save account</button></p>
</form>
{% endblock %}
